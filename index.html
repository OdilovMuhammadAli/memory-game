<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>memory-game</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1 class="title">memory</h1>

    <div class="card">
      <div class="section">
        <p class="label">Select theme</p>
        <div class="row">
          <button class="btn active">Numbers</button>
          <button class="btn">Icons</button>
        </div>
      </div>

      <div class="section">
        <p class="label">Number of players</p>
        <div class="row">
          <button class="btn small active">1</button>
          <button class="btn small">2</button>
          <button class="btn small">3</button>
          <button class="btn small">4</button>
        </div>
      </div>

      <div class="section">
        <p class="label">Grid size</p>
        <div class="row">
          <button class="btn active">4x4</button>
          <button class="btn">6x6</button>
        </div>
      </div>

      <button class="start">Start Game</button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
