<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="menu">
      <h1>memory</h1>

      <div class="card">
        <p>Select Theme</p>
        <div class="buttons">
          <button class="active" data-theme="numbers">Numbers</button>
          <button data-theme="icons">Icons</button>
        </div>

        <p>Number of Players</p>
        <div class="buttons players">
          <button class="active" data-players="1">1</button>
          <button data-players="2">2</button>
          <button data-players="3">3</button>
          <button data-players="4">4</button>
        </div>

        <p>Grid Size</p>
        <div class="buttons grid">
          <button class="active" data-size="4">4x4</button>
          <button data-size="6">6x6</button>
        </div>

        <button id="start">Start Game</button>
      </div>
    </div>

    <div id="game" class="hidden">
      <div id="info"></div>
      <div id="board"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
